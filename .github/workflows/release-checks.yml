name: Release checks

on:
  pull_request:
  push:
    branches: [main, 'hardening/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Offline regression tests
        run: npm run test:ci
      - name: Creator report exclusions
        run: node scripts/test-reporting-exclusions.mjs && npx eslint src/lib/data/reporting-exclusions.ts
      - name: Upload coverage evidence regressions
        run: node --import tsx scripts/test-coverage-classify.ts && node --import tsx scripts/test-upload-coverage-evidence.ts && node --import tsx scripts/test-workbook-range-recovery.ts && node scripts/test-upload-source-replacement.mjs
      - name: Lint hardened entry points
        run: npm run lint:hardening
      - name: Alternate source recovery checks
        run: node scripts/test-source-recovery.mjs && npx eslint src/lib/tiktok/recovery-pages.ts src/app/api/tiktok/recovery/route.ts 'src/app/(admin)/upload/recovery/*.tsx'
      - name: Verify production compilation with dummy configuration
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key
          CREATOR_JWT_SECRET: ci-only-placeholder-key-never-for-deployment
      # This build validates compilation only. Never deploy these dummy-configured outputs.
