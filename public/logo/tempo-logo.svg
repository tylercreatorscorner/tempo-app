<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 64" fill="none">
  <defs>
    <linearGradient id="tempo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B45FF"/>
      <stop offset="100%" stop-color="#9A37EF"/>
    </linearGradient>
  </defs>
  <text x="0" y="48"
    font-family="Inter, system-ui, -apple-system, sans-serif"
    font-weight="800"
    font-size="56"
    letter-spacing="-2.52"
    fill="#1A1B3A">Temp</text>
  <!-- NOTE: this file draws the wordmark as <text>, so it renders correctly
       only where Inter is installed; anywhere else the metrics shift and the
       mark stops sitting where the "o" belongs. The app never uses this file
       (the real lockup is components/ui/tempo-logo.tsx, laid out with flexbox);
       for anything you hand to a third party, use the exported pack, whose
       wordmark is outlined. Numbers below are measured from the real render:
       "Temp" ink = 2.633em wide, mark = 0.80em, gap = 0.025em, mark centre
       0.2427em above the baseline. -->
  <!-- The Beat mark in its canonical 40x40 box, placed as the "o". -->
  <g transform="translate(148.9 12) scale(1.12)">
    <circle cx="20" cy="20" r="20" fill="url(#tempo-grad)"/>
    <rect x="9.25" y="20.5" width="5.5" height="10" rx="2.75" fill="#fff" fill-opacity="0.97"/>
    <rect x="17.25" y="15" width="5.5" height="15.5" rx="2.75" fill="#fff" fill-opacity="0.97"/>
    <rect x="25.25" y="9.5" width="5.5" height="21" rx="2.75" fill="#fff" fill-opacity="0.97"/>
  </g>
</svg>
